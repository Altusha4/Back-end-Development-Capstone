apiVersion: apps/v1
kind: Deployment
metadata:
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels: {run: djangoserver}
  template:
    metadata:
      labels: {run: djangoserver}
    spec:
      containers:
        - name: djangoserver
          image: us.icr.io/REPLACE_NAMESPACE/djangoserver:1
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: {name: django-config}
          env:
            - {name: DJANGO_DEBUG, value: "0"}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            tcpSocket: {port: 8000}
            initialDelaySeconds: 5
      volumes:
        - name: data
          emptyDir: {}
